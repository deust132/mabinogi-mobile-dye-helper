name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 같은 태그가 push되면 실행

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MabinogiDyeHelper
          path: dist/MabinogiDyeHelper.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/MabinogiDyeHelper.exe
          name: Release ${{ github.ref_name }}
          body: |
            ## 마비노기 모바일 염색 도우미 ${{ github.ref_name }}

            ### 다운로드
            아래 `MabinogiDyeHelper.exe` 파일을 다운로드하여 **관리자 권한**으로 실행하세요.

            ### 사용 방법
            1. 마비노기 모바일을 먼저 실행
            2. `MabinogiDyeHelper.exe`를 관리자 권한으로 실행
            3. "영역 설정" 버튼으로 검출할 영역 지정
            4. 원하는 색상을 HEX 코드로 입력 (예: #FF0000)
            5. "시작" 버튼 클릭

            ### 단축키
            - `CTRL + 4,5,6`: 삼각형 꼭지점 저장
            - `CTRL + 7`: 삼각형 초기화
            - `CTRL + 8`: 캡처 시작/중지
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
